services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER_DIRECT:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_DIRECT:-postgres}
      POSTGRES_DB: ${DB_NAME_DIRECT:-remez}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_DIRECT:-postgres} -d ${DB_NAME_DIRECT:-remez}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256

  backend:
    env_file:
      - ./backend/.env.prod
    build:
      context: ./backend
      dockerfile: dockerfile
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/analysis/management/commands/output:/app/analysis/management/commands/output
    depends_on:
      db:
        condition: service_healthy
      pipeline-api:
        condition: service_started
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 3g
    pids_limit: 512

  frontend:
    env_file:
      - ./frontend/.env.prod
    build:
      context: ./frontend
      dockerfile: dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512

  pipeline-api:
    env_file:
      - ./pipeline/.env.prod
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    volumes:
      - ./pipeline/logs:/app/logs
      - ./pipeline/data/external/faers:/app/data/external/faers
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 512

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8600:8600"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 128

volumes:
  db_data: